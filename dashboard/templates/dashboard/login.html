{% extends "base.html" %}
{% block content %}
<div class="login-card">
    <h2 class="mb-1">Tesmus ChurchFlow</h2>
    <p class="text-secondary-custom mb-4">Church Management &amp; Engagement</p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            {{ form.username }}
        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>
            {{ form.password }}
        </div>
        {% if form.errors %}
        <p class="text-danger">Invalid username or password.</p>
        {% endif %}
        <button type="submit" class="btn btn-brand w-100">Sign In</button>
    </form>
</div>
<p class="footer-brand">Powered by Tesmus Technologies</p>
{% endblock %}
