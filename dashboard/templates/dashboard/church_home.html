{% extends "base.html" %}
{% block extra_style %}
<style>
    :root {
        --brand-primary: {{ request.user.church.primary_color }};
        --brand-secondary: {{ request.user.church.secondary_color }};
        --brand-accent: {{ request.user.church.accent_color }};
    }
</style>
{% endblock %}
{% block content %}
<h2>Dashboard</h2>
<div class="row mt-4">
    <div class="col-md-3"><div class="card-custom p-3"><h6 class="text-secondary-custom">Members</h6><h3>{{ summary.total_members }}</h3></div></div>
    <div class="col-md-3"><div class="card-custom p-3"><h6 class="text-secondary-custom">Visitors</h6><h3>{{ summary.total_visitors }}</h3></div></div>
    <div class="col-md-3"><div class="card-custom p-3"><h6 class="text-secondary-custom">Present</h6><h3>{{ summary.present }}</h3></div></div>
    <div class="col-md-3"><div class="card-custom p-3"><h6 class="text-secondary-custom">Attendance Rate</h6><h3>{{ summary.attendance_rate }}%</h3></div></div>
</div>
{% endblock %}
