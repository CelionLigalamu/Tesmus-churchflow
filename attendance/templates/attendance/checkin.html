<!DOCTYPE html>
<html>
<head><title>Check In - {{ service.name }}</title></head>
<body>
    <h2>{{ service.church.name }}</h2>
    <h3>{{ service.name }}</h3>
    {% if message %}<p><strong>{{ message }}</strong></p>{% endif %}
    <form method="post">
        {% csrf_token %}
        <input type="text" name="identifier" placeholder="Member ID or Phone Number" required>
        <button type="submit">Check In</button>
    </form>
</body>
</html>
